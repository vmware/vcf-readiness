name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for a read-only CI token.
permissions:
  actions: write
  contents: read

jobs:
  lint:
    name: ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install "ruff>=0.6"
      - run: ruff check . --output-format=github

  data-hygiene:
    name: customer-facing data hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - run: python tools/check_data_hygiene.py

  version:
    name: version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - run: python tools/check_version_consistency.py

  test:
    name: pytest (${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  python-version: "3.9"  }   # oldest supported
          - { os: ubuntu-latest,  python-version: "3.13" }   # newest
          - { os: windows-latest, python-version: "3.13" }   # OS-specific paths/filenames

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies (pytest & editable package)
        run: pip install "pytest==8.*" && pip install -e .

      - name: Run test suite
        run: python -m pytest tests/ -q --tb=short

      - name: Syntax-check Python files
        run: python -m compileall vcf_hci vcfr_web.py vcfr_collector.py

      - name: Verify zero external runtime dependencies
        run: |
          python -c "
          import sys, importlib
          STDLIB_ONLY = [
              'vcf_hci', 'vcf_hci.constants', 'vcf_hci.logging_utils',
              'vcf_hci.bcg_links', 'vcf_hci.compat_engine',
              'vcf_hci.hcl', 'vcf_hci.bios', 'vcf_hci.collector',
              'vcf_hci.obfuscation', 'vcf_hci.protocol',
          ]
          for mod in STDLIB_ONLY:
              importlib.import_module(mod)
          print('All vcf_hci imports resolve with stdlib only — OK')
          "

  coverage:
    name: pytest coverage (floor 70%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install "pytest==8.*" "pytest-cov==6.*" && pip install -e .
      - run: python -m pytest tests/ -q --cov=vcf_hci --cov-report=term-missing --cov-fail-under=10

  package:
    name: build and smoke wheel/sdist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build wheel and source distribution
        run: |
          python -m pip install "build==1.2.2.post1"
          python -m build
      - name: Validate local release artifacts
        run: |
          version="$(python tools/check_version_consistency.py --print-version)"
          commit_sha="$(git rev-parse HEAD)"
          python tools/release_dry_run.py \
            --version "$version" \
            --commit-sha "$commit_sha" \
            --artifact dist/*.whl \
            --artifact dist/*.tar.gz
      - name: Install and smoke the built wheel
        run: |
          version="$(python tools/check_version_consistency.py --print-version)"
          python -m pip install --force-reinstall --no-deps dist/*.whl
          installed="$(python -I -c 'import vcf_hci; print(vcf_hci.__version__)')"
          test "$installed" = "$version"
          vcf-assess --version | grep -F -- "$version"
          vcf-readiness-web --help

  typecheck:
    name: ty type check (informational)
    runs-on: ubuntu-latest
    continue-on-error: true   # NEVER blocks merge — informational signal only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install "ty==0.0.79"   # pinned — pre-1.0 tool, results must be reproducible
      - run: ty check vcf_hci

